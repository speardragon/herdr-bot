name: Release

# Pushing a tag like v1.2.3 builds the macOS DMGs (for installing) and zips (for the in-app updater)
# and publishes a GitHub release with them.
# The tag must match the version in package.json; the release notes come from CHANGELOG.md.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Check that the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          desktop="$(node -p "require('./desktop/package.json').version")"
          if [ "$tag" != "$version" ] || [ "$tag" != "$desktop" ]; then
            echo "::error::Tag v$tag does not match package.json ($version) / desktop/package.json ($desktop)"
            exit 1
          fi

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck and test
        run: npm run check

      - name: Build the DMGs and zips
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run desktop:package -- --publish never

      - name: Collect artifacts
        run: |
          mkdir -p release
          cp .build/desktop/*.dmg .build/desktop/*.zip release/
          (cd release && shasum -a 256 *.dmg *.zip > SHA256SUMS.txt)
          ls -la release

      - name: Write release notes
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > release/NOTES.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" release/*.dmg release/*.zip release/SHA256SUMS.txt \
            --title "herdr-bot ${GITHUB_REF_NAME#v}" \
            --notes-file release/NOTES.md \
            --verify-tag $prerelease
